<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lantern — Study by asking</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-lantern" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="7.5" y="4.5" width="9" height="12" rx="3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9 20.5h6M12 16.5v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="10.5" r="2.4" fill="currentColor" opacity="0.85"/>
      </svg>
      <div>
        <h1>Lantern</h1>
        <p class="tagline">study by asking, not by answers</p>
      </div>
    </div>

    <div class="subject-block">
      <label for="subject">What are you working on?</label>
      <input id="subject" type="text" placeholder="e.g. limits in calculus, the causes of WWI…" autocomplete="off" />
    </div>

    <div class="sidebar-note">
      <p><strong>How Lantern works</strong></p>
      <p>Instead of handing you the answer, Lantern asks the next question that gets you there yourself. Show your thinking — the more you say, the better it can guide you.</p>
    </div>

    <button id="reset" class="reset-btn" type="button">Start a new session</button>
  </aside>

  <main class="chat-panel">
    <div id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <svg class="empty-lantern" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <rect x="7.5" y="4.5" width="9" height="12" rx="3" stroke="currentColor" stroke-width="1.2"/>
          <path d="M9 20.5h6M12 16.5v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="12" cy="10.5" r="2.4" fill="currentColor" opacity="0.7"/>
        </svg>
        <p>Say what you're stuck on. Lantern will light the next step.</p>
      </div>
    </div>

    <form id="chat-form" class="composer">
      <textarea id="input" rows="1" placeholder="What are you trying to work through?" required></textarea>
      <button type="submit" id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
